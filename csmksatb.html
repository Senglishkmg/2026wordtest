<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학수능특강 입문편 - 어휘 시험 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10 px-4">

    <div class="w-full max-w-5xl mx-auto bg-white shadow-xl rounded-2xl p-6 sm:p-10">
        <!-- 상단 헤더 -->
        <div class="flex flex-col sm:flex-row items-center justify-between pb-6 mb-8 border-b border-gray-200 gap-4">
            <div>
                <span class="text-xs font-bold text-purple-600 bg-purple-100 px-2.5 py-1 rounded-full">EBS 중학수능특강</span>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mt-2">입문편 어휘 시험 목록</h1>
                <p class="text-sm text-gray-500 mt-1">학습할 단원을 선택하세요. (총 30강)</p>
            </div>
            <a href="cs.html" class="inline-flex items-center text-sm font-semibold text-purple-700 bg-purple-50 hover:bg-purple-100 px-4 py-2 rounded-xl transition-colors shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                교재 선택으로 이동
            </a>
        </div>

        <!-- 30개 강 목록 그리드 (아래 스크립트가 자동으로 채움) -->
        <div id="lesson-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>

        <!-- 하단 네비게이션 및 카피라이트 -->
        <div class="mt-10 pt-6 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between text-xs text-gray-400 gap-3">
            <div class="flex items-center gap-4">
                <a href="cs.html" class="hover:text-gray-600 transition-colors underline">교재 선택 목록</a>
                <span>•</span>
                <a href="index.html" class="hover:text-gray-600 transition-colors underline">통합 메인</a>
            </div>
            <span>&copy; 2026 단어 시험 시스템</span>
        </div>
    </div>

    <script>
        /* ================================================================
           ★ 여기만 고치면 됩니다 ★
           - 시험 파일을 올린 강은 제목을 적어 주세요. → 보라색으로 표시
           - 아직 안 올린 강은 비워 두세요("").       → 회색으로 표시
           ================================================================ */
        const lessons = [
            "01과 글의 목적파악1",   // 01강
            "02과 글의 목적파악2",   // 02강
            "03과 단원명 입력",      // 03강  ← 실제 제목으로 바꿔 주세요
            "",  // 04강
            "",  // 05강
            "",  // 06강
            "",  // 07강
            "",  // 08강
            "",  // 09강
            "",  // 10강
            "",  // 11강
            "",  // 12강
            "",  // 13강
            "",  // 14강
            "",  // 15강
            "",  // 16강
            "",  // 17강
            "",  // 18강
            "",  // 19강
            "",  // 20강
            "",  // 21강
            "",  // 22강
            "",  // 23강
            "",  // 24강
            "",  // 25강
            "",  // 26강
            "",  // 27강
            "",  // 28강
            "",  // 29강
            "",  // 30강
        ];
        /* ================================================================ */

        const arrow = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />';
        const grid = document.getElementById('lesson-grid');

        lessons.forEach((title, i) => {
            const no = String(i + 1).padStart(2, '0');
            const ready = title.trim() !== '';
            const label = ready ? title : `${no}강 단원명 미정`;

            const card = ready
                ? 'bg-purple-50/40 border-purple-200 hover:border-purple-400 hover:bg-purple-100/60'
                : 'bg-gray-50 border-gray-200 hover:border-purple-300 hover:bg-purple-50/50';
            const badge = ready
                ? 'bg-purple-600 text-white'
                : 'bg-gray-200 text-gray-700 group-hover:bg-purple-600 group-hover:text-white';
            const text = ready ? 'text-gray-800' : 'text-gray-700';
            const icon = ready ? 'text-purple-400' : 'text-gray-400';

            grid.insertAdjacentHTML('beforeend', `
                <a href="csmksatb${no}.html" class="flex items-center justify-between p-3.5 rounded-xl border transition-all group shadow-sm ${card}">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 transition-colors ${badge}">${no}</span>
                        <span class="text-sm font-semibold group-hover:text-purple-700 ${text}">${label}</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:text-purple-600 group-hover:translate-x-0.5 transition-all shrink-0 ${icon}" fill="none" viewBox="0 0 24 24" stroke="currentColor">${arrow}</svg>
                </a>`);
        });
    </script>
</body>
</html>
